[project]
name = "qodergate-register"
version = "0.1.0"
description = "Qoder standalone auto registrar (infinite loop, exports JSON)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "DrissionPage>=4.1.1",
    "httpx>=0.27.0",
    "pypiwin32>=223",
]

[project.scripts]
qodergate-register = "qodergate_register.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qodergate_register"]
